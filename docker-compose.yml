version: "3.8"

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/movie_database
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  ZOOKEEPER_CONNECT_STRING: zookeeper:2181

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: movie_database
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d movie_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: zookeeper:3.8
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 10

  location-service:
    build: ./location-service
    environment: *service-env
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  user-service:
    build: ./user-service
    environment: *service-env
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  movie-service:
    build: ./movie_service
    environment: *service-env
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  ticket-service:
    build: ./ticket-service
    environment: *service-env
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  image-service:
    build: ./image-service
    environment:
      <<: *service-env
      IMAGE_STORAGE_DIR: /app/images
    ports:
      - "8800:8800"
    volumes:
      - image-data:/app/images
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

volumes:
  postgres-data:
  image-data:
